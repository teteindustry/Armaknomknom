<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>อาม่าหนมๆ</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background: #1a1030;
    font-family: 'Segoe UI', 'Kanit', sans-serif;
    touch-action: none;
  }
  #gameContainer {
    position:relative;
    width:100%; height:100vh;
    max-width:520px;
    margin:0 auto;
    overflow:hidden;
    background: linear-gradient(180deg, #2b1b55 0%, #4a2b7a 40%, #7a3f8f 70%, #ff8fb3 100%);
    transition: background 0.8s ease;
  }
  canvas { display:block; width:100%; height:100%; }

  #hud {
    position:absolute; top:0; left:0; width:100%;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding: 18px 18px 0 18px;
    z-index:10; pointer-events:none;
  }
  #score {
    font-size: 28px; font-weight:800; color:#fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5), 0 0 20px rgba(255,255,255,0.3);
    font-variant-numeric: tabular-nums;
  }
  #comboBadge {
    font-size:14px; font-weight:700; color:#ffe066;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    opacity:0; transform: scale(0.7);
    transition: opacity 0.2s, transform 0.2s;
  }
  #comboBadge.show { opacity:1; transform: scale(1); }
  #best {
    font-size:14px; color:rgba(255,255,255,0.85); text-align:right;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  #startScreen, #overScreen {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: rgba(15,8,35,0.72);
    backdrop-filter: blur(4px);
    z-index:30; text-align:center; padding:24px;
  }
  #overScreen { display:none; }
  .title {
    font-size:34px; font-weight:900; color:#fff; margin-bottom:6px;
    text-shadow: 0 4px 16px rgba(255,143,179,0.6), 0 0 30px rgba(255,255,255,0.3);
    letter-spacing:1px;
  }
  .subtitle { font-size:15px; color:#ffd7e8; margin-bottom:28px; opacity:0.9; }
  .bigEmoji { font-size:64px; margin-bottom:10px; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.4)); }
  .playBtn {
    background: linear-gradient(135deg, #ff9ecb, #ff6f9c);
    color:#fff; border:none; padding:16px 44px; border-radius:50px;
    font-size:20px; font-weight:800; cursor:pointer;
    box-shadow: 0 8px 24px rgba(255,111,156,0.5), inset 0 -3px 0 rgba(0,0,0,0.15);
    transform: translateY(0); transition: transform 0.15s;
  }
  .playBtn:active { transform: translateY(3px); }
  .finalScore { font-size:46px; font-weight:900; color:#ffe066; margin: 10px 0 4px; text-shadow: 0 0 30px rgba(255,224,102,0.6); }
  .newBest { font-size:14px; color:#7CFFB2; font-weight:700; margin-bottom:14px; opacity:0; height:18px; transition:opacity 0.3s; }
  .newBest.show { opacity:1; }
  .hint { font-size:13px; color:rgba(255,255,255,0.7); margin-top:22px; }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div>
      <div id="score">0</div>
      <div id="comboBadge">COMBO x2</div>
    </div>
    <div id="best">สูงสุด: 0</div>
  </div>

  <div id="startScreen">
    <div class="bigEmoji">🐶🍬</div>
    <div class="title">อาม่าหนมๆ</div>
    <div class="subtitle">ลาก / แตะ ซ้าย-ขวา เพื่อรับขนมที่หล่นลงมา<br>หลบของไม่ดีด้วยนะ!</div>
    <button class="playBtn" id="startBtn">เริ่มเล่น</button>
  </div>

  <div id="overScreen">
    <div class="title">จบเกม!</div>
    <div class="finalScore" id="finalScore">0</div>
    <div class="newBest" id="newBestMsg">🎉 สูงสุดใหม่!</div>
    <button class="playBtn" id="retryBtn">เล่นอีกครั้ง</button>
    <div class="hint">แตะปุ่มเพื่อเริ่มใหม่</div>
  </div>
</div>

<script>
(function(){
  const container = document.getElementById('gameContainer');
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const comboBadge = document.getElementById('comboBadge');
  const startScreen = document.getElementById('startScreen');
  const overScreen = document.getElementById('overScreen');
  const finalScoreEl = document.getElementById('finalScore');
  const newBestMsg = document.getElementById('newBestMsg');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');

  let W, H, DPR;
  function resize(){
    const rect = container.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = rect.width; H = rect.height;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Storage ----------
  let best = 0;
  try { best = parseInt(localStorage.getItem('candyCatchBest') || '0', 10) || 0; } catch(e){ best = 0; }
  bestEl.textContent = 'สูงสุด: ' + best;

  // ---------- Game state ----------
  let running = false;
  let score = 0;
  let combo = 0;
  let comboTimer = 0;
  let elapsed = 0;
  let spawnTimer = 0;
  let spawnInterval = 1.0;
  let items = [];
  let particles = [];
  let popups = [];
  let bgHueShift = 0;
  let shakeAmount = 0;
  let flashAlpha = 0;

  // Dog character (drawn programmatically to resemble the plush: white body, tan patches, tan ears, brown nose)
  const dog = {
    x: 0, y: 0, w: 92, h: 78,
    targetX: 0,
    vx: 0,
    bob: 0
  };

  function resetDog(){
    dog.x = W/2;
    dog.targetX = W/2;
    dog.y = H - 70;
  }

  // ---------- Input ----------
  let pointerActive = false;
  function setTargetFromClientX(clientX){
    const rect = canvas.getBoundingClientRect();
    dog.targetX = clientX - rect.left;
  }
  container.addEventListener('pointerdown', (e)=>{
    pointerActive = true;
    setTargetFromClientX(e.clientX);
  });
  container.addEventListener('pointermove', (e)=>{
    if(pointerActive) setTargetFromClientX(e.clientX);
  });
  window.addEventListener('pointerup', ()=>{ pointerActive = false; });
  container.addEventListener('touchstart', (e)=>{
    pointerActive = true;
    setTargetFromClientX(e.touches[0].clientX);
  }, {passive:true});
  container.addEventListener('touchmove', (e)=>{
    if(pointerActive) setTargetFromClientX(e.touches[0].clientX);
  }, {passive:true});
  window.addEventListener('touchend', ()=>{ pointerActive = false; });

  // keyboard for desktop testing
  let keyLeft=false, keyRight=false;
  window.addEventListener('keydown', (e)=>{
    if(e.key==='ArrowLeft') keyLeft=true;
    if(e.key==='ArrowRight') keyRight=true;
  });
  window.addEventListener('keyup', (e)=>{
    if(e.key==='ArrowLeft') keyLeft=false;
    if(e.key==='ArrowRight') keyRight=false;
  });

  // ---------- Item types ----------
  const GOOD_EMOJIS = ['🍬','🍭','🍡','🧁','🍩','🍪'];
  const BAD_EMOJIS = ['🪨','⚡','🦴'];
  const POWERUP_EMOJIS = ['🧲','⭐'];

  function spawnItem(){
    const roll = Math.random();
    let type = 'good';
    let emoji = GOOD_EMOJIS[Math.floor(Math.random()*GOOD_EMOJIS.length)];
    if (roll < 0.14) {
      type = 'bad';
      emoji = BAD_EMOJIS[Math.floor(Math.random()*BAD_EMOJIS.length)];
    } else if (roll < 0.20) {
      type = 'power';
      emoji = POWERUP_EMOJIS[Math.floor(Math.random()*POWERUP_EMOJIS.length)];
    }
    const size = type==='power' ? 34 : (26 + Math.random()*14);
    items.push({
      x: 30 + Math.random()*(W-60),
      y: -30,
      vy: 120 + Math.random()*80 + Math.min(elapsed*4, 160),
      rot: Math.random()*Math.PI*2,
      vrot: (Math.random()-0.5)*3,
      emoji, type, size,
      wobble: Math.random()*Math.PI*2
    });
  }

  // ---------- Particles ----------
  function burst(x, y, colorList, count){
    for(let i=0;i<count;i++){
      const ang = Math.random()*Math.PI*2;
      const spd = 60 + Math.random()*180;
      particles.push({
        x, y,
        vx: Math.cos(ang)*spd,
        vy: Math.sin(ang)*spd - 60,
        life: 1,
        decay: 1.4 + Math.random()*1.2,
        size: 3 + Math.random()*5,
        color: colorList[Math.floor(Math.random()*colorList.length)]
      });
    }
  }

  function addPopup(x, y, text, color){
    popups.push({x, y, text, color, life:1, vy:-50});
  }

  const GOOD_COLORS = ['#ff9ecb','#ffe066','#7CFFB2','#8ecbff','#c99bff'];
  const BAD_COLORS = ['#ff5b5b','#ff9e5b'];
  const POWER_COLORS = ['#ffe066','#fff5c2','#ffd166'];

  let magnetTimer = 0;

  // ---------- Effects toggles ----------
  let comboCount = 0;

  function triggerShake(amt){ shakeAmount = Math.max(shakeAmount, amt); }
  function triggerFlash(amt){ flashAlpha = Math.max(flashAlpha, amt); }

  // ---------- Main loop ----------
  let lastTime = null;
  function loop(ts){
    if(lastTime === null) lastTime = ts;
    let dt = (ts - lastTime)/1000;
    if(dt > 0.05) dt = 0.05;
    lastTime = ts;

    if(running){
      update(dt);
    }
    render(dt);
    requestAnimationFrame(loop);
  }

  function update(dt){
    elapsed += dt;

    // difficulty ramps
    spawnInterval = Math.max(0.35, 1.0 - elapsed*0.012);

    spawnTimer += dt;
    if(spawnTimer >= spawnInterval){
      spawnTimer = 0;
      spawnItem();
    }

    // dog movement (smooth follow)
    if(keyLeft) dog.targetX -= 6;
    if(keyRight) dog.targetX += 6;
    dog.targetX = Math.max(dog.w/2, Math.min(W - dog.w/2, dog.targetX));
    const dx = dog.targetX - dog.x;
    dog.vx = dx * 8;
    dog.x += dog.vx * dt;
    dog.bob += dt * 10;

    if(magnetTimer > 0) magnetTimer -= dt;
    if(comboTimer > 0){
      comboTimer -= dt;
      if(comboTimer <= 0){
        combo = 0;
        comboBadge.classList.remove('show');
      }
    }

    // items
    for(let i = items.length -1; i>=0; i--){
      const it = items[i];
      it.y += it.vy * dt;
      it.rot += it.vrot * dt;
      it.wobble += dt*4;

      // magnet effect pulls good items toward dog
      if(magnetTimer > 0 && it.type !== 'bad'){
        const ddx = dog.x - it.x;
        it.x += ddx * dt * 2.2;
      } else {
        it.x += Math.sin(it.wobble) * 10 * dt;
      }

      // collision with dog (simple distance/box check)
      const dogTop = dog.y - dog.h*0.35;
      if(it.y + it.size*0.4 > dogTop && it.y < dog.y + dog.h*0.5){
        const distX = Math.abs(it.x - dog.x);
        if(distX < dog.w*0.55){
          handleCatch(it);
          items.splice(i,1);
          continue;
        }
      }

      if(it.y > H + 40){
        if(it.type === 'good'){
          // missed candy breaks combo softly
          combo = 0;
          comboBadge.classList.remove('show');
        }
        items.splice(i,1);
      }
    }

    // particles
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.vy += 260*dt;
      p.x += p.vx*dt;
      p.y += p.vy*dt;
      p.life -= p.decay*dt;
      if(p.life <= 0) particles.splice(i,1);
    }

    // popups
    for(let i=popups.length-1;i>=0;i--){
      const p = popups[i];
      p.y += p.vy*dt;
      p.life -= dt*1.1;
      if(p.life <= 0) popups.splice(i,1);
    }

    if(shakeAmount > 0) shakeAmount *= Math.max(0, 1 - dt*8);
    if(flashAlpha > 0) flashAlpha *= Math.max(0, 1 - dt*6);

    // background hue drifts with score
    bgHueShift = Math.min(score/8, 60);
    container.style.background = `linear-gradient(180deg,
      hsl(${255 - bgHueShift}, 55%, 22%) 0%,
      hsl(${280 - bgHueShift}, 55%, 35%) 40%,
      hsl(${310 - bgHueShift}, 60%, 48%) 70%,
      hsl(${335 - bgHueShift}, 90%, 72%) 100%)`;
  }

  function handleCatch(it){
    if(it.type === 'good'){
      combo++;
      comboTimer = 1.4;
      const mult = 1 + Math.floor(combo/3);
      const gained = 10 * mult;
      score += gained;
      scoreEl.textContent = score;
      burst(it.x, it.y, GOOD_COLORS, 16 + Math.min(combo,10));
      addPopup(it.x, it.y, '+'+gained, '#ffe066');
      if(combo >= 2){
        comboBadge.textContent = 'COMBO x' + combo;
        comboBadge.classList.add('show');
      }
      if(combo>0 && combo % 8 === 0){
        triggerFlash(0.35);
      }
    } else if(it.type === 'bad'){
      combo = 0;
      comboBadge.classList.remove('show');
      burst(it.x, it.y, BAD_COLORS, 20);
      triggerShake(14);
      triggerFlash(0.5);
      endGame();
    } else if(it.type === 'power'){
      burst(it.x, it.y, POWER_COLORS, 22);
      addPopup(it.x, it.y, it.emoji==='🧲' ? 'แม่เหล็ก!' : 'โบนัส!', '#7CFFB2');
      if(it.emoji === '🧲'){
        magnetTimer = 5;
      } else {
        score += 30;
        scoreEl.textContent = score;
      }
    }
  }

  // ---------- Rendering ----------
  function drawDog(){
    ctx.save();
    const bobY = Math.sin(dog.bob)*3;
    const tiltAngle = Math.max(-0.25, Math.min(0.25, -dog.vx*0.0025));
    ctx.translate(dog.x, dog.y + bobY);
    ctx.rotate(tiltAngle);

    const w = dog.w, h = dog.h;

    // shadow
    ctx.save();
    ctx.translate(0, h*0.62);
    ctx.scale(1,0.3);
    ctx.beginPath();
    ctx.arc(0,0,w*0.5,0,Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fill();
    ctx.restore();

    // body (white round)
    ctx.beginPath();
    ctx.ellipse(0, h*0.05, w*0.5, h*0.48, 0, 0, Math.PI*2);
    ctx.fillStyle = '#f7f3ec';
    ctx.fill();

    // ears (tan)
    ctx.beginPath();
    ctx.ellipse(-w*0.36, -h*0.28, w*0.17, h*0.20, -0.3, 0, Math.PI*2);
    ctx.fillStyle = '#d99a5b';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(w*0.36, -h*0.28, w*0.17, h*0.20, 0.3, 0, Math.PI*2);
    ctx.fillStyle = '#d99a5b';
    ctx.fill();

    // tan face patch (stripe like the plush)
    ctx.beginPath();
    ctx.ellipse(-w*0.22, -h*0.05, w*0.2, h*0.32, 0, 0, Math.PI*2);
    ctx.fillStyle = '#d99a5b';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(w*0.22, -h*0.05, w*0.2, h*0.32, 0, 0, Math.PI*2);
    ctx.fillStyle = '#d99a5b';
    ctx.fill();

    // muzzle (white)
    ctx.beginPath();
    ctx.ellipse(0, h*0.1, w*0.27, h*0.24, 0, 0, Math.PI*2);
    ctx.fillStyle = '#fbfaf7';
    ctx.fill();

    // eyes
    ctx.beginPath();
    ctx.arc(-w*0.13, -h*0.05, w*0.045, 0, Math.PI*2);
    ctx.arc(w*0.13, -h*0.05, w*0.045, 0, Math.PI*2);
    ctx.fillStyle = '#2a1c14';
    ctx.fill();

    // nose
    ctx.beginPath();
    ctx.ellipse(0, h*0.08, w*0.08, h*0.06, 0, 0, Math.PI*2);
    ctx.fillStyle = '#4a2d1c';
    ctx.fill();

    // smile
    ctx.beginPath();
    ctx.moveTo(-w*0.09, h*0.16);
    ctx.quadraticCurveTo(0, h*0.24, w*0.09, h*0.16);
    ctx.strokeStyle = '#4a2d1c';
    ctx.lineWidth = 2;
    ctx.stroke();

    // feet
    ctx.beginPath();
    ctx.ellipse(-w*0.3, h*0.42, w*0.1, h*0.09, 0, 0, Math.PI*2);
    ctx.ellipse(w*0.3, h*0.42, w*0.1, h*0.09, 0, 0, Math.PI*2);
    ctx.fillStyle = '#f7f3ec';
    ctx.fill();

    // magnet glow ring
    if(magnetTimer > 0){
      ctx.beginPath();
      const pulse = 1 + Math.sin(dog.bob*3)*0.08;
      ctx.ellipse(0, h*0.05, w*0.62*pulse, h*0.58*pulse, 0, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(255,224,102,0.7)';
      ctx.lineWidth = 4;
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawItem(it){
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.rotate(it.rot);
    ctx.font = it.size + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if(it.type === 'bad'){
      ctx.shadowColor = 'rgba(255,80,80,0.7)';
      ctx.shadowBlur = 10;
    } else if(it.type === 'power'){
      ctx.shadowColor = 'rgba(255,224,102,0.9)';
      ctx.shadowBlur = 16;
    } else {
      ctx.shadowColor = 'rgba(255,255,255,0.5)';
      ctx.shadowBlur = 6;
    }
    ctx.fillText(it.emoji, 0, 0);
    ctx.restore();
  }

  function drawParticles(){
    for(const p of particles){
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.restore();
    }
  }

  function drawPopups(){
    for(const p of popups){
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.font = '800 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = p.color;
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 6;
      ctx.fillText(p.text, p.x, p.y);
      ctx.restore();
    }
  }

  function drawBackgroundDecor(t){
    // soft floating glow orbs for ambience
    for(let i=0;i<5;i++){
      const px = (i/5)*W + Math.sin(t*0.5 + i)*20;
      const py = (H*0.15) + i*40 + Math.sin(t*0.3+i*2)*15;
      const r = 40 + i*6;
      const grad = ctx.createRadialGradient(px,py,0,px,py,r);
      grad.addColorStop(0, 'rgba(255,255,255,0.10)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(px,py,r,0,Math.PI*2);
      ctx.fill();
    }
  }

  function render(dt){
    ctx.clearRect(0,0,W,H);

    ctx.save();
    if(shakeAmount > 0.1){
      const sx = (Math.random()-0.5)*shakeAmount;
      const sy = (Math.random()-0.5)*shakeAmount;
      ctx.translate(sx, sy);
    }

    drawBackgroundDecor(performance.now()/1000);

    for(const it of items) drawItem(it);
    drawDog();
    drawParticles();
    drawPopups();

    ctx.restore();

    if(flashAlpha > 0.01){
      ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
      ctx.fillRect(0,0,W,H);
    }
  }

  // ---------- Game flow ----------
  function startGame(){
    score = 0; combo = 0; comboTimer = 0; elapsed = 0; spawnTimer = 0;
    items = []; particles = []; popups = [];
    magnetTimer = 0; shakeAmount = 0; flashAlpha = 0;
    scoreEl.textContent = '0';
    comboBadge.classList.remove('show');
    resetDog();
    startScreen.style.display = 'none';
    overScreen.style.display = 'none';
    running = true;
  }

  function endGame(){
    running = false;
    finalScoreEl.textContent = score;
    let isNew = false;
    if(score > best){
      best = score;
      isNew = true;
      try { localStorage.setItem('candyCatchBest', String(best)); } catch(e){}
      bestEl.textContent = 'สูงสุด: ' + best;
    }
    newBestMsg.classList.toggle('show', isNew);
    setTimeout(()=>{ overScreen.style.display = 'flex'; }, 300);
  }

  startBtn.addEventListener('click', startGame);
  retryBtn.addEventListener('click', startGame);

  resetDog();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
