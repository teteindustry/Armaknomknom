
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>อาม่าหนมๆ</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background: #1a1030;
    font-family: 'Segoe UI', 'Kanit', sans-serif;
    touch-action: none;
  }
  #gameContainer {
    position:relative;
    width:100%; height:100vh;
    max-width:520px;
    margin:0 auto;
    overflow:hidden;
    background: linear-gradient(180deg, #2b1b55 0%, #4a2b7a 40%, #7a3f8f 70%, #ff8fb3 100%);
  }
  canvas { display:block; width:100%; height:100%; }

  #hud {
    position:absolute; top:0; left:0; width:100%;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding: 16px 16px 0 16px;
    z-index:10; pointer-events:none;
  }
  #score {
    font-size: 26px; font-weight:800; color:#fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5), 0 0 20px rgba(255,255,255,0.3);
    font-variant-numeric: tabular-nums;
  }
  #comboBadge {
    font-size:13px; font-weight:700; color:#ffe066;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    opacity:0; transform: scale(0.7);
    transition: opacity 0.2s, transform 0.2s;
  }
  #comboBadge.show { opacity:1; transform: scale(1); }
  #rightHud { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  #hearts { display:flex; gap:4px; }
  .heart { width:22px; height:20px; position:relative; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4)); }
  #best { font-size:13px; color:rgba(255,255,255,0.85); text-align:right; text-shadow: 0 1px 4px rgba(0,0,0,0.5); }

  #startScreen, #overScreen {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: rgba(15,8,35,0.72);
    backdrop-filter: blur(4px);
    z-index:30; text-align:center; padding:24px;
  }
  #overScreen { display:none; }
  .title {
    font-size:32px; font-weight:900; color:#fff; margin-bottom:6px;
    text-shadow: 0 4px 16px rgba(255,143,179,0.6), 0 0 30px rgba(255,255,255,0.3);
    letter-spacing:1px;
  }
  .subtitle { font-size:14px; color:#ffd7e8; margin-bottom:24px; opacity:0.9; line-height:1.6; }
  .bigEmoji { width:130px; height:auto; margin-bottom:8px; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.4)); }
  .playBtn {
    background: linear-gradient(135deg, #ff9ecb, #ff6f9c);
    color:#fff; border:none; padding:15px 42px; border-radius:50px;
    font-size:19px; font-weight:800; cursor:pointer;
    box-shadow: 0 8px 24px rgba(255,111,156,0.5), inset 0 -3px 0 rgba(0,0,0,0.15);
    transform: translateY(0); transition: transform 0.15s;
  }
  .playBtn:active { transform: translateY(3px); }
  .finalScore { font-size:44px; font-weight:900; color:#ffe066; margin: 8px 0 4px; text-shadow: 0 0 30px rgba(255,224,102,0.6); }
  .newBest { font-size:14px; color:#7CFFB2; font-weight:700; margin-bottom:14px; opacity:0; height:18px; transition:opacity 0.3s; }
  .newBest.show { opacity:1; }
  .hint { font-size:12px; color:rgba(255,255,255,0.7); margin-top:20px; }
  .overSprite { width:150px; height:auto; margin-bottom:6px; filter: drop-shadow(0 6px 14px rgba(0,0,0,0.4)); }
</style>
</head>
